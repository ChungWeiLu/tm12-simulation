<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東興帆布鋼架 TM12 雙滑台焊接涵蓋模擬 V1.9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: 'Inter', sans-serif; user-select: none; }
        button:focus { outline: none; }
        .val-display { min-width: 65px; text-align: center; font-variant-numeric: tabular-nums; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- Three.js 畫布容器 -->
    <div id="canvas-container" class="absolute top-0 left-0 w-full h-full"></div>

    <!-- UI 控制面板 -->
    <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 w-[95%] max-w-5xl bg-gray-900/95 backdrop-blur-md border border-gray-700 p-4 rounded-2xl shadow-2xl text-white z-10 pointer-events-auto">
        <div class="flex flex-wrap items-center justify-between border-b border-gray-700 pb-2 mb-3 gap-2">
            <div class="flex items-center gap-3">
                <h1 class="text-base font-bold text-gray-100 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    東興帆布鋼架 TM12 雙滑台焊接涵蓋模擬系統
                    <span class="bg-blue-600/30 border border-blue-500 text-blue-300 text-xs px-2 py-0.5 rounded font-mono">V1.9</span>
                </h1>
                
                <!-- 新增：單雙手臂數量切換按鈕 -->
                <div class="flex bg-gray-800 rounded-lg p-0.5 border border-gray-700 ml-2">
                    <button id="btn-1-arm" class="px-3 py-1 text-xs rounded-md text-gray-400 hover:text-white transition-colors">1 台</button>
                    <button id="btn-2-arms" class="px-3 py-1 text-xs rounded-md bg-blue-600 text-white font-bold transition-colors shadow-sm">2 台</button>
                </div>
            </div>

            <div class="flex gap-4 text-xs text-gray-400">
                <span>D28 桌體: 6.4m x 1.2m</span>
                <span id="arm-reach-text">TM12 臂展: 1.30m (1300mm)</span>
            </div>
        </div>
        
        <!-- 6 欄控制項 (2列x3欄) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
            <!-- 1. 左軌中心距左桌緣 -->
            <div class="flex justify-between items-center bg-gray-800 px-3 py-2 rounded-lg border border-gray-700">
                <span class="text-xs font-medium text-blue-400">● 左軌中心距左桌緣</span>
                <div class="flex items-center gap-1">
                    <button id="l-off-minus" class="w-6 h-6 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded text-white font-bold">-</button>
                    <span id="l-off-val" class="val-display font-mono text-gray-200 text-xs">1500 mm</span>
                    <button id="l-off-plus" class="w-6 h-6 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded text-white font-bold">+</button>
                </div>
            </div>

            <!-- 2. 右軌中心距右桌緣 (加入 ID 以便動態變暗) -->
            <div id="right-offset-control" class="flex justify-between items-center bg-gray-800 px-3 py-2 rounded-lg border border-gray-700 transition-opacity duration-300">
                <span class="text-xs font-medium text-orange-400">● 右軌中心距右桌緣</span>
                <div class="flex items-center gap-1">
                    <button id="r-off-minus" class="w-6 h-6 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded text-white font-bold">-</button>
                    <span id="r-off-val" class="val-display font-mono text-gray-200 text-xs">1500 mm</span>
                    <button id="r-off-plus" class="w-6 h-6 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded text-white font-bold">+</button>
                </div>
            </div>

            <!-- 3. 單軌總長度 -->
            <div class="flex justify-between items-center bg-gray-800 px-3 py-2 rounded-lg border border-gray-700">
                <span class="text-xs font-medium text-purple-400">● 軌道總長度 (等長)</span>
                <div class="flex items-center gap-1">
                    <button id="len-minus" class="w-6 h-6 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded text-white font-bold">-</button>
                    <span id="len-val" class="val-display font-mono text-gray-200 text-xs">3000 mm</span>
                    <button id="len-plus" class="w-6 h-6 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded text-white font-bold">+</button>
                </div>
            </div>

            <!-- 4. 軌道端點死區 -->
            <div class="flex justify-between items-center bg-gray-800 px-3 py-2 rounded-lg border border-gray-700">
                <span class="text-xs font-medium text-yellow-400">● 兩端死點區 (退縮)</span>
                <div class="flex items-center gap-1">
                    <button id="dz-minus" class="w-6 h-6 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded text-white font-bold">-</button>
                    <span id="dz-val" class="val-display font-mono text-gray-200 text-xs">100 mm</span>
                    <button id="dz-plus" class="w-6 h-6 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded text-white font-bold">+</button>
                </div>
            </div>

            <!-- 5. 軌道中心至桌邊距 (支援負值) -->
            <div class="flex justify-between items-center bg-gray-800 px-3 py-2 rounded-lg border border-gray-700">
                <span class="text-xs font-medium text-green-400">● 軌道中心至桌邊距</span>
                <div class="flex items-center gap-1">
                    <button id="dist-minus" class="w-6 h-6 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded text-white font-bold">-</button>
                    <span id="dist-val" class="val-display font-mono text-gray-200 text-xs">100 mm</span>
                    <button id="dist-plus" class="w-6 h-6 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded text-white font-bold">+</button>
                </div>
            </div>

            <!-- 6. 機械手臂工作範圍 (臂展) -->
            <div class="flex justify-between items-center bg-gray-800 px-3 py-2 rounded-lg border border-gray-700">
                <span class="text-xs font-medium text-cyan-400">● 手臂工作半徑 (臂展)</span>
                <div class="flex items-center gap-1">
                    <button id="reach-minus" class="w-6 h-6 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded text-white font-bold">-</button>
                    <span id="reach-val" class="val-display font-mono text-gray-200 text-xs">1300 mm</span>
                    <button id="reach-plus" class="w-6 h-6 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded text-white font-bold">+</button>
                </div>
            </div>
        </div>
        
        <p class="text-center text-[11px] text-gray-400 mt-2.5">
            💡 提示：左桌緣基準點為 X=-3200，右桌緣基準點為 X=+3200。黃色方塊為滑動極限死點。畫面可直接左右拖曳圓心，背景支援平移與平滑縮放。
        </p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. 全局狀態與變數
        let armCount = 2;       // 預設為 2 台手臂
        
        let leftOffset = 1500;  // 左軌中心距左側桌緣 (mm)
        let rightOffset = 1500; // 右軌中心距右側桌緣 (mm)
        let trackLength = 3000; // 兩軌長度 (mm)
        let deadZone = 100;     // 兩端點死區退縮量 (mm)
        let distance = 100;     // 軌道中心至桌邊距離 (mm)
        let armReach = 1300;    // 手臂工作範圍半徑 (mm)

        let arm1X = -3200 + 1500; 
        let arm2X = 3200 - 1500;  

        // 2. 初始化 Three.js 場景與正交攝影機
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const aspect = Math.max(0.1, window.innerWidth / Math.max(1, window.innerHeight));
        const viewSize = 5600; 
        const camera = new THREE.OrthographicCamera(
            -viewSize * aspect / 2, viewSize * aspect / 2,
            viewSize / 2, -viewSize / 2,
            0.1, 20000 
        );
        
        camera.position.set(0, -2100, 2000);
        camera.lookAt(0, -2100, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableRotate = false;
        controls.enablePan = true;
        controls.enableZoom = false; // 採用自訂平滑縮放機制
        controls.target.set(0, -2100, 0);
        controls.update();

        // 平滑滾輪縮放邏輯
        renderer.domElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = Math.exp(-e.deltaY * 0.0015);
            camera.zoom *= zoomFactor;
            camera.zoom = Math.max(0.3, Math.min(3.5, camera.zoom));
            camera.updateProjectionMatrix();
        }, { passive: false });

        // 3. 建立 3D 物件 (桌體、網格)
        const tableGeo = new THREE.PlaneGeometry(6400, 1200);
        const tableMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
        const table = new THREE.Mesh(tableGeo, tableMat);
        table.position.set(0, -600, 0);
        scene.add(table);

        const gridMat = new THREE.LineBasicMaterial({ color: 0x555555, transparent: true, opacity: 0.4 });
        const gridGeo = new THREE.BufferGeometry();
        const gridPoints = [];
        for (let x = -3200; x <= 3200; x += 100) {
            gridPoints.push(new THREE.Vector3(x, 0, 1));
            gridPoints.push(new THREE.Vector3(x, -1200, 1));
        }
        for (let y = 0; y >= -1200; y -= 100) {
            gridPoints.push(new THREE.Vector3(-3200, y, 1));
            gridPoints.push(new THREE.Vector3(3200, y, 1));
        }
        gridGeo.setFromPoints(gridPoints);
        const gridLines = new THREE.LineSegments(gridGeo, gridMat);
        scene.add(gridLines);

        const edgeGeo = new THREE.EdgesGeometry(tableGeo);
        const edgeMat = new THREE.LineBasicMaterial({ color: 0x888888, linewidth: 2 });
        const edgeLines = new THREE.LineSegments(edgeGeo, edgeMat);
        edgeLines.position.set(0, -600, 1);
        scene.add(edgeLines);

        // 軌道物件
        const unitTrackGeo = new THREE.PlaneGeometry(1, 100);
        
        const leftRailMat = new THREE.MeshBasicMaterial({ color: 0x3a4e69 });
        const leftRail = new THREE.Mesh(unitTrackGeo, leftRailMat);
        scene.add(leftRail);

        const rightRailMat = new THREE.MeshBasicMaterial({ color: 0x8c522b });
        const rightRail = new THREE.Mesh(unitTrackGeo, rightRailMat);
        scene.add(rightRail);

        // 軌道 4 個黃色死區卡榫標示 (Stoppers)
        const stopperGeo = new THREE.PlaneGeometry(16, 120);
        const stopperMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });

        const stoppers = [
            new THREE.Mesh(stopperGeo, stopperMat), // 左軌左死點
            new THREE.Mesh(stopperGeo, stopperMat), // 左軌右死點
            new THREE.Mesh(stopperGeo, stopperMat), // 右軌左死點
            new THREE.Mesh(stopperGeo, stopperMat)  // 右軌右死點
        ];
        stoppers.forEach(s => {
            s.position.z = 2.5;
            scene.add(s);
        });

        // 建立機械手臂物件 (涵蓋範圍支援動態縮放)
        function createArm(colorHex, idName) {
            const group = new THREE.Group();
            
            const reachGeo = new THREE.CircleGeometry(1, 64);
            const reachMat = new THREE.MeshBasicMaterial({ 
                color: colorHex, transparent: true, opacity: 0.35, depthWrite: false 
            });
            const reach = new THREE.Mesh(reachGeo, reachMat);
            reach.position.z = 3;
            group.add(reach);

            const borderGeo = new THREE.EdgesGeometry(reachGeo);
            const borderMat = new THREE.LineBasicMaterial({ color: colorHex, opacity: 0.8, transparent: true });
            const border = new THREE.LineSegments(borderGeo, borderMat);
            border.position.z = 3;
            group.add(border);

            const handleGeo = new THREE.CircleGeometry(45, 32);
            const handleMat = new THREE.MeshBasicMaterial({ color: colorHex });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.z = 4;
            handle.userData = { arm: idName };
            group.add(handle);
            
            const dotGeo = new THREE.CircleGeometry(14, 16);
            const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const dot = new THREE.Mesh(dotGeo, dotMat);
            dot.position.z = 5;
            group.add(dot);

            return { group, handle, reach, border };
        }

        const leftArm = createArm(0x2980b9, 'left');
        const rightArm = createArm(0xd35400, 'right');
        scene.add(leftArm.group);
        scene.add(rightArm.group);

        // 4. 更新佈局與邊界約束
        function updateLayout() {
            document.getElementById('l-off-val').innerText = `${leftOffset} mm`;
            document.getElementById('r-off-val').innerText = `${rightOffset} mm`;
            document.getElementById('len-val').innerText = `${trackLength} mm`;
            document.getElementById('dz-val').innerText = `${deadZone} mm`;
            document.getElementById('dist-val').innerText = `${distance} mm`;
            document.getElementById('reach-val').innerText = `${armReach} mm`;
            document.getElementById('arm-reach-text').innerText = `TM12 臂展: ${(armReach / 1000).toFixed(2)}m (${armReach}mm)`;

            const railY = -1200 - distance;
            const leftCenterX = -3200 + leftOffset;
            const rightCenterX = 3200 - rightOffset;

            // 更新軌道尺寸與座標
            leftRail.scale.x = trackLength;
            leftRail.position.set(leftCenterX, railY, 2);

            rightRail.scale.x = trackLength;
            rightRail.position.set(rightCenterX, railY, 2);

            // 更新 4 處黃色死區卡榫位置
            const lStop1X = leftCenterX - (trackLength / 2) + deadZone;
            const lStop2X = leftCenterX + (trackLength / 2) - deadZone;
            const rStop1X = rightCenterX - (trackLength / 2) + deadZone;
            const rStop2X = rightCenterX + (trackLength / 2) - deadZone;

            stoppers[0].position.set(lStop1X, railY, 2.5);
            stoppers[1].position.set(lStop2X, railY, 2.5);
            stoppers[2].position.set(rStop1X, railY, 2.5);
            stoppers[3].position.set(rStop2X, railY, 2.5);

            // 動態更新手臂涵蓋範圍半徑
            leftArm.reach.scale.set(armReach, armReach, 1);
            leftArm.border.scale.set(armReach, armReach, 1);
            rightArm.reach.scale.set(armReach, armReach, 1);
            rightArm.border.scale.set(armReach, armReach, 1);

            // 限制手臂滑動範圍
            const leftMin = lStop1X;
            const leftMax = lStop2X;
            if (leftMin > leftMax) arm1X = leftCenterX;
            else arm1X = Math.max(leftMin, Math.min(leftMax, arm1X));

            const rightMin = rStop1X;
            const rightMax = rStop2X;
            if (rightMin > rightMax) arm2X = rightCenterX;
            else arm2X = Math.max(rightMin, Math.min(rightMax, arm2X));

            leftArm.group.position.set(arm1X, railY, 0);
            rightArm.group.position.set(arm2X, railY, 0);

            // ====== 處理單雙手臂顯示隱藏與 UI 防呆 ======
            const rightControl = document.getElementById('right-offset-control');
            if (armCount === 1) {
                rightRail.visible = false;
                rightArm.group.visible = false;
                stoppers[2].visible = false; // 隱藏右側死點 1
                stoppers[3].visible = false; // 隱藏右側死點 2
                
                // 控制面板防呆：將右軌距桌緣按鈕變暗且禁止點擊
                rightControl.style.opacity = '0.3';
                rightControl.style.pointerEvents = 'none';
            } else {
                rightRail.visible = true;
                rightArm.group.visible = true;
                stoppers[2].visible = true;
                stoppers[3].visible = true;

                // 恢復控制面板
                rightControl.style.opacity = '1';
                rightControl.style.pointerEvents = 'auto';
            }
        }

        // 5. 控制項按鈕事件綁定
        const btn1Arm = document.getElementById('btn-1-arm');
        const btn2Arms = document.getElementById('btn-2-arms');

        btn1Arm.onclick = () => {
            armCount = 1;
            btn1Arm.className = "px-3 py-1 text-xs rounded-md bg-blue-600 text-white font-bold transition-colors shadow-sm";
            btn2Arms.className = "px-3 py-1 text-xs rounded-md text-gray-400 hover:text-white transition-colors";
            updateLayout();
        };

        btn2Arms.onclick = () => {
            armCount = 2;
            btn2Arms.className = "px-3 py-1 text-xs rounded-md bg-blue-600 text-white font-bold transition-colors shadow-sm";
            btn1Arm.className = "px-3 py-1 text-xs rounded-md text-gray-400 hover:text-white transition-colors";
            updateLayout();
        };

        document.getElementById('l-off-minus').onclick = () => { leftOffset = Math.max(0, leftOffset - 100); updateLayout(); };
        document.getElementById('l-off-plus').onclick = () => { leftOffset = Math.min(4000, leftOffset + 100); updateLayout(); };

        document.getElementById('r-off-minus').onclick = () => { rightOffset = Math.max(0, rightOffset - 100); updateLayout(); };
        document.getElementById('r-off-plus').onclick = () => { rightOffset = Math.min(4000, rightOffset + 100); updateLayout(); };

        document.getElementById('len-minus').onclick = () => { trackLength = Math.max(500, trackLength - 100); updateLayout(); };
        document.getElementById('len-plus').onclick = () => { trackLength = Math.min(6000, trackLength + 100); updateLayout(); };

        document.getElementById('dz-minus').onclick = () => { deadZone = Math.max(0, deadZone - 10); updateLayout(); };
        document.getElementById('dz-plus').onclick = () => { deadZone = Math.min(1000, deadZone + 10); updateLayout(); };
        
        document.getElementById('dist-minus').onclick = () => { distance = Math.max(-1000, distance - 10); updateLayout(); };
        document.getElementById('dist-plus').onclick = () => { distance = Math.min(1000, distance + 10); updateLayout(); };

        document.getElementById('reach-minus').onclick = () => { armReach = Math.max(200, armReach - 10); updateLayout(); };
        document.getElementById('reach-plus').onclick = () => { armReach = Math.min(2500, armReach + 10); updateLayout(); };

        updateLayout();

        // 6. 滑鼠拖曳互動邏輯
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let draggedArm = null;

        const dom = renderer.domElement;

        function getMousePos(e) {
            const rect = dom.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        }

        dom.addEventListener('pointerdown', (e) => {
            getMousePos(e);
            raycaster.setFromCamera(mouse, camera);
            
            // 根據選擇的手臂數量，決定哪些圓心可以被拖曳
            const activeHandles = armCount === 1 ? [leftArm.handle] : [leftArm.handle, rightArm.handle];
            const intersects = raycaster.intersectObjects(activeHandles);
            
            if (intersects.length > 0) {
                draggedArm = intersects[0].object.userData.arm;
                controls.enabled = false;
                dom.style.cursor = 'grabbing';
            }
        });

        dom.addEventListener('pointermove', (e) => {
            getMousePos(e);
            raycaster.setFromCamera(mouse, camera);

            if (!draggedArm) {
                const activeHandles = armCount === 1 ? [leftArm.handle] : [leftArm.handle, rightArm.handle];
                const intersects = raycaster.intersectObjects(activeHandles);
                dom.style.cursor = intersects.length > 0 ? 'grab' : 'default';
            } else {
                const worldX = raycaster.ray.origin.x; 
                if (draggedArm === 'left') {
                    arm1X = worldX;
                } else if (draggedArm === 'right') {
                    arm2X = worldX;
                }
                updateLayout();
            }
        });

        window.addEventListener('pointerup', () => {
            if (draggedArm) {
                draggedArm = null;
                controls.enabled = true;
                dom.style.cursor = 'default';
            }
        });

        // 7. 視窗尺寸適應與渲染迴圈
        window.addEventListener('resize', () => {
            const width = Math.max(1, window.innerWidth);
            const height = Math.max(1, window.innerHeight);
            const newAspect = width / height;

            camera.left = -viewSize * newAspect / 2;
            camera.right = viewSize * newAspect / 2;
            camera.top = viewSize / 2;
            camera.bottom = -viewSize / 2;
            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
